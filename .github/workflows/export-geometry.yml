name: Export OpenSCAD STL and previews

on:
  push:
    paths:
      - 'cad/**'
      - 'tools/**'
      - '.github/workflows/export-geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Install OpenSCAD and headless renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install mesh checker
        run: python -m pip install 'trimesh>=4,<5' 'numpy>=1.26,<3' 'networkx>=3,<5'
      - name: Build Rev.A reference meshes
        run: bash tools/export_stl.sh 32
      - name: Build Rev.A reference preview
        run: |
          mkdir -p images
          xvfb-run -a openscad -o images/assembly_pole32.png \
            --imgsize=1200,900 --colorscheme=Tomorrow --viewall --autocenter \
            --camera=0,0,0,65,0,40,480 \
            -D 'part="assembly"' -D 'pole_diameter=32' cad/HA750BL_dual_clamp.scad
      - name: Build Rev.B meshes and assembly image
        run: bash tools/export_revB.sh
      - name: Validate generated Rev.B STL files
        run: python tools/validate_revB.py
      - name: Commit generated STL and PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stl/ images/
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current"
          else
            git commit -m 'build: refresh generated STL and assembly images'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
